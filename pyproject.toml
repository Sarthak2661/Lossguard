[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lossguard"
version = "0.1.0"
description = "Real-time fraud-risk and false-decline cost optimizer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "confluent-kafka>=2.6,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dateutil>=2.9,<3",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "shap>=0.46,<1",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.39,<2",
  "uvicorn[standard]>=0.30,<1",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
dbt = ["dbt-postgres>=1.9,<2"]
monitoring = ["evidently>=0.7,<0.8"]
notebook = [
  "ipykernel>=6,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["SimulatedDataset.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
