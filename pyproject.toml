[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lossguard"
version = "0.1.0"
description = "Real-time fraud-risk and false-decline cost optimizer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "confluent-kafka>=2.6,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "llvmlite>=0.49,<0.50",
  "numba>=0.67,<0.68",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "plotly>=5.24,<8",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dateutil>=2.9,<3",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "shap>=0.46,<1",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.39,<2",
  "uvicorn[standard]>=0.30,<1",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]
dbt = [
  "dbt-postgres>=1.9,<2",
  "sqlparse==0.6.0",
]
monitoring = ["evidently>=0.7,<0.8"]
notebook = [
  "ipykernel>=6,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
]

[tool.setuptools]
packages = [
  "lossguard",
  "apps",
  "apps.consumer",
  "apps.outbox_publisher",
  "apps.dashboard",
  "apps.producer",
  "apps.scoring_api",
  "ml",
  "monitoring",
  "maintenance",
]

[tool.setuptools.package-dir]
lossguard = "src/lossguard"
apps = "apps"
ml = "ml"
monitoring = "monitoring"
maintenance = "maintenance"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
  "integration: requires running Redpanda and PostgreSQL services",
]

[tool.coverage.run]
branch = true
source = ["lossguard", "apps.consumer", "apps.outbox_publisher", "apps.producer", "apps.scoring_api", "ml", "monitoring", "maintenance"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
omit = [
  "apps/dashboard/*",
  "monitoring/scheduler.py",
  "streamlit_app.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["SimulatedDataset.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
