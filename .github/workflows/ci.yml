name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/test.lock

      - name: Generate CI-only development secrets
        run: python scripts/bootstrap_env.py

      - name: Install project and test dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/test.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run unit tests
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=75

      - name: Validate notebook structure
        run: >-
          python -c "import nbformat;
          notebook=nbformat.read('notebooks/01_cost_sensitive_model.ipynb', as_version=4);
          nbformat.validate(notebook)"

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.observability.yml \
            --profile observability config --quiet

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/test.lock

      - name: Generate CI-only development secrets
        run: python scripts/bootstrap_env.py

      - name: Install project and test dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/test.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Start integration dependencies
        run: |
          docker compose up -d redpanda postgres
          docker compose run --rm schema-init
          docker compose run --rm topic-init

      - name: Run Kafka, PostgreSQL, retry, and idempotency tests
        run: |
          set -a
          source .env
          set +a
          export KAFKA_BOOTSTRAP_SERVERS=localhost:19092
          export RUN_INTEGRATION_TESTS=1
          python -m pytest -m integration

      - name: Show dependency logs on failure
        if: failure()
        run: docker compose logs redpanda postgres schema-init topic-init

      - name: Stop integration dependencies
        if: always()
        run: docker compose down --volumes
