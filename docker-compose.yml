name: lossguard

x-app: &app
  build:
    context: .
  env_file:
    - path: .env
      required: false
  environment:
    POSTGRES_DB: ${POSTGRES_DB:-lossguard}
    POSTGRES_USER: ${POSTGRES_USER:-lossguard}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lossguard_local_only}
    DATABASE_URL: postgresql://${POSTGRES_USER:-lossguard}:${POSTGRES_PASSWORD:-lossguard_local_only}@postgres:5432/${POSTGRES_DB:-lossguard}
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    SCORING_API_URL: http://scoring-api:8000
    MODEL_BUNDLE_PATH: /models/fraud_model.joblib
    MODEL_METADATA_PATH: /models/model_metadata.json
    PII_HASH_SALT: ${PII_HASH_SALT:-change-this-in-any-shared-environment}
    LLM_PROVIDER: ${LLM_PROVIDER:-auto}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
    OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
    OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
    LLM_EXPLANATION_TIMEOUT_SECONDS: ${LLM_EXPLANATION_TIMEOUT_SECONDS:-8}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    PYTHONPATH: /app/src:/app
  volumes:
    - ./models:/models
    - ./src:/app/src:ro
    - ./apps:/app/apps:ro
    - ./streamlit_app.py:/app/streamlit_app.py:ro
  restart: unless-stopped

services:
  redpanda:
    image: redpandadata/redpanda:v25.1.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk -X brokers=localhost:9092 cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  topic-init:
    image: redpandadata/redpanda:v25.1.9
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >
        rpk -X brokers=redpanda:9092 topic create txns.raw txns.scored txns.rejected
        --partitions=3 --replicas=1 || true;
        rpk -X brokers=redpanda:9092 -X admin.hosts=redpanda:9644 cluster config set enable_consumer_group_metrics
        '["group","partition","consumer_lag"]';
        rpk -X brokers=redpanda:9092 -X admin.hosts=redpanda:9644 cluster config set
        consumer_group_lag_collection_interval_sec 5
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lossguard}
      POSTGRES_USER: ${POSTGRES_USER:-lossguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lossguard_local_only}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lossguard} -d ${POSTGRES_DB:-lossguard}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  schema-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-lossguard_local_only}
    volumes:
      - ./infrastructure/postgres/init.sql:/schema/init.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >
        psql -h postgres -U ${POSTGRES_USER:-lossguard} -d ${POSTGRES_DB:-lossguard}
        -v ON_ERROR_STOP=1 -f /schema/init.sql
    restart: "no"

  scoring-api:
    <<: *app
    command: ["uvicorn", "apps.scoring_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  consumer:
    <<: *app
    command: ["python", "-m", "apps.consumer.main"]
    depends_on:
      topic-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
      scoring-api:
        condition: service_healthy

  producer:
    <<: *app
    command: ["python", "-m", "apps.producer.main"]
    restart: "no"
    depends_on:
      topic-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      DATASET_PATH: /data/fraudTest.csv
      REPLAY_MODE: ${REPLAY_MODE:-demo}
      REPLAY_LIMIT: ${REPLAY_LIMIT:-10000}
      PII_HASH_SALT: ${PII_HASH_SALT:-change-this-in-any-shared-environment}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./dataset:/data:ro
      - ./src:/app/src:ro
      - ./apps:/app/apps:ro
      - ./scripts:/app/scripts:ro

  dashboard:
    <<: *app
    image: lossguard-consumer:latest
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    depends_on:
      schema-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      redpanda:
        condition: service_healthy
      cadvisor:
        condition: service_started
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-lossguard_admin_local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      schema-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    restart: unless-stopped

  drift-monitor:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    command: ["python", "-m", "monitoring.scheduler"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lossguard}:${POSTGRES_PASSWORD:-lossguard_local_only}@postgres:5432/${POSTGRES_DB:-lossguard}
      DRIFT_TRAINING_PATH: /data/fraudTrain.csv
      DRIFT_REPORT_DIR: /reports/drift
      DRIFT_REFERENCE_ROWS: ${DRIFT_REFERENCE_ROWS:-10000}
      DRIFT_CURRENT_ROWS: ${DRIFT_CURRENT_ROWS:-10000}
      DRIFT_MIN_CURRENT_ROWS: ${DRIFT_MIN_CURRENT_ROWS:-500}
      DRIFT_SHARE_THRESHOLD: ${DRIFT_SHARE_THRESHOLD:-0.30}
      DRIFT_INTERVAL_SECONDS: ${DRIFT_INTERVAL_SECONDS:-604800}
      MODEL_METADATA_PATH: /models/model_metadata.json
      PII_HASH_SALT: ${PII_HASH_SALT:-change-this-in-any-shared-environment}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./dataset:/data:ro
      - ./models:/models:ro
      - ./reports:/reports
      - ./src:/app/src:ro
      - ./ml:/app/ml:ro
      - ./monitoring:/app/monitoring:ro
    depends_on:
      schema-init:
        condition: service_completed_successfully
    restart: unless-stopped

  trainer:
    <<: *app
    command:
      - python
      - -m
      - ml.train
      - --input
      - /data/fraudTrain.csv
      - --output
      - /models/fraud_model.joblib
      - --metadata-output
      - /models/model_metadata.json
      - --max-rows
      - ${TRAIN_MAX_ROWS:-300000}
    profiles: ["tools"]
    restart: "no"
    volumes:
      - ./dataset:/data:ro
      - ./models:/models
      - ./src:/app/src:ro
      - ./ml:/app/ml:ro

  dbt:
    build:
      context: .
    working_dir: /app/analytics/dbt
    entrypoint: ["dbt"]
    command: ["build", "--profiles-dir", "."]
    profiles: ["tools"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-lossguard}
      POSTGRES_USER: ${POSTGRES_USER:-lossguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lossguard_local_only}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./analytics/dbt:/app/analytics/dbt

  test:
    build:
      context: .
    command: ["pytest", "--cov=lossguard", "--cov=apps", "--cov-report=term-missing"]
    profiles: ["tools"]
    restart: "no"
    volumes:
      - ./tests:/app/tests:ro
      - ./src:/app/src:ro
      - ./apps:/app/apps:ro

  lint:
    build:
      context: .
    command: ["ruff", "check", "."]
    profiles: ["tools"]
    restart: "no"

volumes:
  redpanda_data:
  postgres_data:
  prometheus_data:
  grafana_data:
