name: lossguard

x-runtime: &runtime
  image: lossguard-runtime:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - path: .env
      required: false
  environment: &app-environment
    POSTGRES_DB: ${POSTGRES_DB:-lossguard}
    POSTGRES_USER: ${POSTGRES_USER:-lossguard}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/bootstrap_env.py}
    DATABASE_URL: postgresql://${POSTGRES_USER:-lossguard}:${POSTGRES_PASSWORD:?Run python scripts/bootstrap_env.py}@postgres:5432/${POSTGRES_DB:-lossguard}
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    SCORING_API_URL: http://scoring-api:8000
    SCORING_API_MAX_ATTEMPTS: ${SCORING_API_MAX_ATTEMPTS:-3}
    SCORING_API_RETRY_BACKOFF_SECONDS: ${SCORING_API_RETRY_BACKOFF_SECONDS:-0.5}
    POSTGRES_POOL_MIN_SIZE: ${POSTGRES_POOL_MIN_SIZE:-1}
    POSTGRES_POOL_MAX_SIZE: ${POSTGRES_POOL_MAX_SIZE:-8}
    CONSUMER_WRITE_BATCH_SIZE: ${CONSUMER_WRITE_BATCH_SIZE:-100}
    CONSUMER_FLUSH_SECONDS: ${CONSUMER_FLUSH_SECONDS:-1}
    DRIFT_HEALTH_MAX_AGE_SECONDS: ${DRIFT_HEALTH_MAX_AGE_SECONDS:-691200}
    MODEL_BUNDLE_PATH: /models/fraud_model.joblib
    MODEL_METADATA_PATH: /models/model_metadata.json
    PII_HASH_SALT: ${PII_HASH_SALT:?Run python scripts/bootstrap_env.py}
    SCORING_API_KEY: ${SCORING_API_KEY:?Run python scripts/bootstrap_env.py}
    ADMIN_API_KEY: ${ADMIN_API_KEY:?Run python scripts/bootstrap_env.py}
    LLM_PROVIDER: ${LLM_PROVIDER:-auto}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
    OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
    OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
    LLM_EXPLANATION_TIMEOUT_SECONDS: ${LLM_EXPLANATION_TIMEOUT_SECONDS:-8}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    - ./models:/models
    - ./src:/app/src:ro
    - ./apps:/app/apps:ro
    - ./streamlit_app.py:/app/streamlit_app.py:ro
  restart: unless-stopped

services:
  redpanda:
    image: redpandadata/redpanda:v25.1.9@sha256:8f7e9e4c1422baaa1a5e2a6c6c668cfe05442cb3cb476542c7dff61725e6fe31
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk -X brokers=localhost:9092 cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  topic-init:
    image: redpandadata/redpanda:v25.1.9@sha256:8f7e9e4c1422baaa1a5e2a6c6c668cfe05442cb3cb476542c7dff61725e6fe31
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >
        rpk -X brokers=redpanda:9092 topic create txns.raw txns.scored txns.rejected
        --partitions=3 --replicas=1 || true;
        rpk -X brokers=redpanda:9092 topic alter-config txns.raw txns.scored
        --set retention.ms=$${KAFKA_TRANSACTION_RETENTION_MS};
        rpk -X brokers=redpanda:9092 topic alter-config txns.rejected
        --set retention.ms=$${KAFKA_REJECTED_RETENTION_MS};
        rpk -X brokers=redpanda:9092 -X admin.hosts=redpanda:9644 cluster config set enable_consumer_group_metrics
        '["group","partition","consumer_lag"]';
        rpk -X brokers=redpanda:9092 -X admin.hosts=redpanda:9644 cluster config set
        consumer_group_lag_collection_interval_sec 5
    environment:
      KAFKA_TRANSACTION_RETENTION_MS: ${KAFKA_TRANSACTION_RETENTION_MS:-604800000}
      KAFKA_REJECTED_RETENTION_MS: ${KAFKA_REJECTED_RETENTION_MS:-2592000000}
    restart: "no"

  postgres:
    image: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lossguard}
      POSTGRES_USER: ${POSTGRES_USER:-lossguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/bootstrap_env.py}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lossguard} -d ${POSTGRES_DB:-lossguard}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  schema-init:
    image: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/bootstrap_env.py}
      POSTGRES_DB: ${POSTGRES_DB:-lossguard}
      POSTGRES_USER: ${POSTGRES_USER:-lossguard}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:?Run python scripts/bootstrap_env.py}
    volumes:
      - ./infrastructure/postgres/migrations:/migrations:ro
      - ./infrastructure/postgres/run-migrations.sh:/migration-runner/run.sh:ro
    entrypoint: ["/bin/sh", "/migration-runner/run.sh"]
    restart: "no"

  dataset-check:
    image: lossguard-trainer:local
    build:
      context: .
      dockerfile: docker/Dockerfile.trainer
    command: ["python", "scripts/validate_dataset.py", "--data-dir", "/data", "--manifest", "config/dataset_manifest.json"]
    restart: "no"
    volumes:
      - ./dataset:/data:ro

  model-init:
    image: lossguard-trainer:local
    env_file:
      - path: .env
        required: false
    environment:
      PII_HASH_SALT: ${PII_HASH_SALT:?Run python scripts/bootstrap_env.py}
    command:
      - python
      - scripts/ensure_model.py
      - --input
      - /data/fraudTrain.csv
      - --test-input
      - /data/fraudTest.csv
      - --output
      - /models/fraud_model.joblib
      - --metadata-output
      - /models/model_metadata.json
      - --max-rows
      - ${TRAIN_MAX_ROWS:-300000}
      - --max-test-rows
      - ${TEST_MAX_ROWS:-0}
    restart: "no"
    depends_on:
      dataset-check:
        condition: service_completed_successfully
    volumes:
      - ./dataset:/data:ro
      - ./models:/models

  scoring-api:
    <<: *runtime
    command: ["uvicorn", "apps.scoring_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      schema-init:
        condition: service_completed_successfully
      model-init:
        condition: service_completed_successfully

  consumer:
    <<: *runtime
    command: ["python", "-m", "apps.consumer.main"]
    depends_on:
      topic-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
      scoring-api:
        condition: service_healthy

  outbox-publisher:
    <<: *runtime
    command: ["python", "-m", "apps.outbox_publisher.main"]
    environment:
      <<: *app-environment
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-0.25}
    depends_on:
      topic-init:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully

  producer:
    <<: *runtime
    command: ["python", "-m", "apps.producer.main"]
    restart: "no"
    depends_on:
      dataset-check:
        condition: service_completed_successfully
      consumer:
        condition: service_started
    environment:
      <<: *app-environment
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      DATASET_PATH: /data/fraudTest.csv
      REPLAY_MODE: ${REPLAY_MODE:-demo}
      REPLAY_LIMIT: ${REPLAY_LIMIT:-10000}
      PII_HASH_SALT: ${PII_HASH_SALT:?Run python scripts/bootstrap_env.py}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./dataset:/data:ro
      - ./src:/app/src:ro
      - ./apps:/app/apps:ro
      - ./scripts:/app/scripts:ro

  dashboard:
    <<: *runtime
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      schema-init:
        condition: service_completed_successfully

  drift-monitor:
    image: lossguard-monitoring:local
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    command: ["python", "-m", "monitoring.scheduler"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lossguard}:${POSTGRES_PASSWORD:?Run python scripts/bootstrap_env.py}@postgres:5432/${POSTGRES_DB:-lossguard}
      DRIFT_TRAINING_PATH: /data/fraudTrain.csv
      DRIFT_REPORT_DIR: /reports/drift
      DRIFT_REFERENCE_ROWS: ${DRIFT_REFERENCE_ROWS:-10000}
      DRIFT_CURRENT_ROWS: ${DRIFT_CURRENT_ROWS:-10000}
      DRIFT_MIN_CURRENT_ROWS: ${DRIFT_MIN_CURRENT_ROWS:-500}
      DRIFT_SHARE_THRESHOLD: ${DRIFT_SHARE_THRESHOLD:-0.30}
      DRIFT_INTERVAL_SECONDS: ${DRIFT_INTERVAL_SECONDS:-604800}
      MODEL_METADATA_PATH: /models/model_metadata.json
      PII_HASH_SALT: ${PII_HASH_SALT:?Run python scripts/bootstrap_env.py}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./dataset:/data:ro
      - ./models:/models:ro
      - ./reports:/reports
      - ./src:/app/src:ro
      - ./ml:/app/ml:ro
      - ./monitoring:/app/monitoring:ro
    depends_on:
      schema-init:
        condition: service_completed_successfully
    restart: unless-stopped

  retention:
    image: lossguard-monitoring:local
    command: ["python", "-m", "maintenance.retention"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lossguard}:${POSTGRES_PASSWORD:?Run python scripts/bootstrap_env.py}@postgres:5432/${POSTGRES_DB:-lossguard}
      DRIFT_REPORT_DIR: /reports/drift
      RETENTION_SCORED_DAYS: ${RETENTION_SCORED_DAYS:-730}
      RETENTION_REJECTIONS_DAYS: ${RETENTION_REJECTIONS_DAYS:-30}
      RETENTION_METRICS_DAYS: ${RETENTION_METRICS_DAYS:-90}
      RETENTION_DRIFT_REPORTS_DAYS: ${RETENTION_DRIFT_REPORTS_DAYS:-180}
      RETENTION_OUTBOX_DAYS: ${RETENTION_OUTBOX_DAYS:-7}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-86400}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./reports:/reports
    depends_on:
      schema-init:
        condition: service_completed_successfully
    restart: unless-stopped

  trainer:
    image: lossguard-trainer:local
    build:
      context: .
      dockerfile: docker/Dockerfile.trainer
    command:
      - python
      - -m
      - ml.train
      - --input
      - /data/fraudTrain.csv
      - --test-input
      - /data/fraudTest.csv
      - --output
      - /models/fraud_model.joblib
      - --metadata-output
      - /models/model_metadata.json
      - --max-rows
      - ${TRAIN_MAX_ROWS:-300000}
      - --max-test-rows
      - ${TEST_MAX_ROWS:-0}
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      PII_HASH_SALT: ${PII_HASH_SALT:?Run python scripts/bootstrap_env.py}
    restart: "no"
    volumes:
      - ./dataset:/data:ro
      - ./models:/models
      - ./src:/app/src:ro
      - ./ml:/app/ml:ro
    depends_on:
      dataset-check:
        condition: service_completed_successfully

  dbt:
    image: lossguard-dbt:local
    build:
      context: .
      dockerfile: docker/Dockerfile.dbt
    working_dir: /app/analytics/dbt
    entrypoint: ["dbt"]
    command: ["build", "--profiles-dir", "."]
    profiles: ["tools"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-lossguard}
      POSTGRES_USER: ${POSTGRES_USER:-lossguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/bootstrap_env.py}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./analytics/dbt:/app/analytics/dbt

  test:
    image: lossguard-test:local
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    command: ["pytest", "--cov", "--cov-report=term-missing", "--cov-fail-under=75"]
    profiles: ["tools"]
    restart: "no"
    volumes:
      - ./tests:/app/tests:ro
      - ./src:/app/src:ro
      - ./apps:/app/apps:ro

  lint:
    image: lossguard-test:local
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    command: ["ruff", "check", "."]
    profiles: ["tools"]
    restart: "no"

volumes:
  redpanda_data:
  postgres_data:
